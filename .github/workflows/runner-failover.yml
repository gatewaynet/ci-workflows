name: Runner Failover Watchdog

# Probes k8s-xeon from GitHub's side every 30 min. If the cluster is
# unreachable, sets CI_RUNNER_OVERRIDE=ubuntu-latest on every repo so all
# shared-workflow stages fall back to GitHub-hosted runners; clears it again
# when the cluster comes back. Runs on ubuntu-latest by design — it must work
# precisely when the self-hosted runners cannot.
#
# gatewaynet is a personal user account (no organization), so there is no
# org-variables API — the override is reconciled as a REPO variable across
# all owned repos instead. The shared workflows read vars.CI_RUNNER_OVERRIDE,
# which resolves repo variables.
#
# Cadence: */30 ≈ 1440 billed min/month (each run rounds up to 1 min),
# comfortably inside the 3000 included Team-plan minutes that normal CI no
# longer consumes.
#
# Requires repo secret CI_FAILOVER_TOKEN: fine-grained PAT (owner gatewaynet)
# with access to All repositories and Repository permissions
# "Actions: read & write" + "Variables: read & write". Without it the job
# exits neutrally so the schedule never spams failures.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: runner-failover
  cancel-in-progress: false

env:
  # Any HTTP response (even 4xx/5xx) proves the cluster's ingress is up;
  # only connection failure / timeout counts as offline.
  PROBE_URL: https://argocd.clanroot.dev
  VAR_NAME: CI_RUNNER_OVERRIDE
  FALLBACK: ubuntu-latest

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check token
        id: token
        env:
          GH_TOKEN: ${{ secrets.CI_FAILOVER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::CI_FAILOVER_TOKEN not configured — watchdog inactive"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe k8s-xeon
        id: probe
        if: steps.token.outputs.configured == 'true'
        run: |
          probe() { curl -sS -o /dev/null -m 10 "$PROBE_URL"; }
          # Two attempts 30s apart — a transient blip must not flip CI
          if probe; then
            echo "up=true" >> "$GITHUB_OUTPUT"; echo "Cluster reachable"; exit 0
          fi
          echo "First probe failed, retrying in 30s..."
          sleep 30
          if probe; then
            echo "up=true" >> "$GITHUB_OUTPUT"; echo "Cluster reachable (2nd attempt)"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"; echo "Cluster OFFLINE"
          fi

      - name: Reconcile override variable on all repos
        if: steps.token.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_FAILOVER_TOKEN }}
          UP: ${{ steps.probe.outputs.up }}
        run: |
          set +e  # best-effort: one bad repo must not abort the rest
          gh api "user/repos?affiliation=owner&per_page=100" --paginate \
            -q '.[].full_name' > "$RUNNER_TEMP/repos.txt"
          echo "Reconciling $(wc -l < "$RUNNER_TEMP/repos.txt" | xargs) repos (cluster up=${UP})"

          SET=0; CLEARED=0
          while read -r REPO; do
            CURRENT=$(gh api "repos/${REPO}/actions/variables/${VAR_NAME}" -q .value 2>/dev/null)
            if [ "$UP" = "false" ] && [ -z "$CURRENT" ]; then
              gh api -X POST "repos/${REPO}/actions/variables" \
                -f name="${VAR_NAME}" -f value="${FALLBACK}" >/dev/null 2>&1 && SET=$((SET+1))
            elif [ "$UP" = "true" ] && [ "$CURRENT" = "${FALLBACK}" ]; then
              # Only clear the exact value we set — a manual override with any
              # other value (e.g. ubuntu-24.04) is never touched
              gh api -X DELETE "repos/${REPO}/actions/variables/${VAR_NAME}" >/dev/null 2>&1 && CLEARED=$((CLEARED+1))
            fi
          done < "$RUNNER_TEMP/repos.txt"

          if [ "$SET" -gt 0 ]; then
            echo "::warning::k8s-xeon offline — failed over ${SET} repo(s) to ${FALLBACK}"
            echo "### ⚠️ Failover ACTIVE → \`${FALLBACK}\` (${SET} repos)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CLEARED" -gt 0 ]; then
            echo "::notice::k8s-xeon back — ${CLEARED} repo(s) returned to self-hosted runners"
            echo "### ✅ Recovered → self-hosted (${CLEARED} repos)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Steady state — nothing to change"
          fi

      # Runs queued before the flip stay pinned to self-hosted labels and
      # would never start. Cancel + rerun makes them re-resolve runs-on with
      # the override in place. Runs every offline tick (not just the first)
      # to catch stragglers; the label check keeps it precise.
      - name: Requeue runs stuck on self-hosted labels
        if: steps.token.outputs.configured == 'true' && steps.probe.outputs.up == 'false'
        env:
          GH_TOKEN: ${{ secrets.CI_FAILOVER_TOKEN }}
        run: |
          set +e  # best-effort sweep: one bad repo must not abort the rest
          REQUEUED=0
          while read -r REPO; do
            for RUN in $(gh api "repos/${REPO}/actions/runs?status=queued&per_page=50" -q '.workflow_runs[].id' 2>/dev/null); do
              STUCK=$(gh api "repos/${REPO}/actions/runs/${RUN}/jobs?per_page=100" \
                -q '[.jobs[] | select(.status=="queued") | .labels[] | select(startswith("self-hosted"))] | length' 2>/dev/null)
              [ -n "$STUCK" ] && [ "$STUCK" -gt 0 ] || continue

              echo "Requeueing ${REPO} run ${RUN} (queued on self-hosted labels)"
              gh api -X POST "repos/${REPO}/actions/runs/${RUN}/cancel" >/dev/null 2>&1
              for _ in $(seq 1 10); do
                sleep 3
                [ "$(gh api "repos/${REPO}/actions/runs/${RUN}" -q .status 2>/dev/null)" = "completed" ] && break
              done
              if gh api -X POST "repos/${REPO}/actions/runs/${RUN}/rerun" >/dev/null 2>&1; then
                REQUEUED=$((REQUEUED+1))
              else
                echo "::warning::Could not rerun ${REPO} run ${RUN} — rerun it manually"
              fi
            done
          done < "$RUNNER_TEMP/repos.txt"

          echo "Requeued ${REQUEUED} run(s)"
          if [ "${REQUEUED}" -gt 0 ]; then
            echo "### 🔁 Requeued ${REQUEUED} stuck run(s) onto \`${FALLBACK}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
