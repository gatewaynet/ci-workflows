# Heavy Runner Scale Set — org-wide (all gatewaynet repos)
# For: Docker builds, E2E tests, Go race detection, multi-image builds
# Helm chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# Docker via DinD sidecar over tcp://localhost:2375 (same pattern as the
# per-repo scale sets deployed via infra.env — proven with docker buildx).

githubConfigUrl: "https://github.com/gatewaynet"

# Reference to K8s secret containing GitHub App credentials
# The GitHub App needs org-level "Self-hosted runners: read & write" for org scope.
githubConfigSecret: github-arc-credentials

# Runner labels - use in workflows with: runs-on: self-hosted-heavy
runnerScaleSetName: self-hosted-heavy

minRunners: 0
maxRunners: 6

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 8Gi
        env:
          - name: DOCKER_HOST
            value: tcp://localhost:2375
      # Docker-in-Docker sidecar for container builds on self-hosted
      - name: dind
        image: docker:dind
        securityContext:
          privileged: true
        env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
        resources:
          requests:
            cpu: "500m"
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
