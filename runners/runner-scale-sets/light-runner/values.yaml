# Light Runner Scale Set — org-wide (all gatewaynet repos)
# For: lint, typecheck, unit tests, utility jobs (git tags, version sync,
#      ArgoCD restarts, registry cleanup)
# Helm chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# No containerMode: kubernetes here — that mode requires every job to declare
# a `container:`, which breaks plain run-step jobs. Plain ephemeral pods
# (matches the proven per-repo scale sets deployed via infra.env).

githubConfigUrl: "https://github.com/gatewaynet"

# Reference to K8s secret containing GitHub App credentials
# Secret must contain: github_app_id, github_app_installation_id, github_app_private_key
# The GitHub App needs org-level "Self-hosted runners: read & write" for org scope.
githubConfigSecret: github-arc-credentials

# Runner labels - use in workflows with: runs-on: self-hosted-light
runnerScaleSetName: self-hosted-light

minRunners: 0
maxRunners: 4

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "500m"
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
